<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudo sobre Jesus | Urantia America</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap">
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="/home-button.js" data-into=".top" defer></script>
<style>
:root { --navy:#17365d; --navy2:#0f2744; --gold:#d8b25a; --bg:#f7f5ef; --line:#e4dfd2; --text:#1d2433; --dim:#5d6678; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { font-family:"Noto Sans", system-ui, sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; height:100dvh; }
aside { width:300px; flex-shrink:0; background:var(--navy); color:#fff; display:flex; flex-direction:column; }
.top { padding:18px 18px 14px; border-bottom:1px solid #ffffff22; }
.home { display:inline-block; background:var(--gold); color:#1b1f2a; font-weight:800; text-decoration:none; border-radius:999px; padding:7px 16px; font-size:14.5px; }
.home:hover { filter:brightness(1.07); }
h1 { margin:16px 0 2px; font-size:24px; font-weight:800; }
.sub { margin:0; color:#c8d3e6; font-size:13.5px; }
nav { flex:1; overflow:auto; padding:10px; }
nav a { display:flex; gap:10px; align-items:flex-start; color:#e9eef7; text-decoration:none; padding:11px 12px; border-radius:10px; font-size:15.5px; line-height:1.4; }
nav a:hover { background:#ffffff14; }
nav a.on { background:#ffffff; color:var(--navy); font-weight:700; }
.n { flex-shrink:0; width:24px; height:24px; border-radius:50%; background:#ffffff26; display:inline-flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; }
nav a.on .n { background:var(--gold); color:#1b1f2a; }
main { flex:1; min-width:0; display:flex; flex-direction:column; }
.bar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 16px; background:#fff; border-bottom:1px solid var(--line); font-size:14px; }
.bar b { color:var(--navy); }
.bar a { color:var(--dim); font-size:13px; }
iframe { flex:1; width:100%; border:0; background:#fff; }
.menuBtn { display:none; }
@media (max-width: 820px) {
  body { flex-direction:column; }
  aside { width:auto; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; }
  h1 { margin:0; font-size:19px; }
  .sub { display:none; }
  .menuBtn { display:inline-block; font:inherit; font-size:14px; background:#ffffff1f; color:#fff; border:1px solid #ffffff44; border-radius:999px; padding:6px 14px; cursor:pointer; }
  nav { display:none; max-height:60vh; }
  aside.open nav { display:block; }
}
</style>
</head>
<body>
<aside id="side">
  <div class="top">
    <div><h1>Estudo sobre Jesus</h1><p class="sub">Urantia America</p></div>
    <button type="button" class="menuBtn" id="menuBtn" aria-expanded="false">☰ Menu</button>
  </div>
  <nav id="nav" aria-label="Menu">
    <a href="/pt/jesus/discourses/" data-id="discourses"><span class="n">1</span><span>Os discursos de Jesus</span></a>
    <a href="/pt/jesus/chronology/" data-id="chronology"><span class="n">2</span><span>Cronologia de Jesus (por ano)</span></a>
    <a href="/pt/jesus/ages/" data-id="ages"><span class="n">3</span><span>Cronologia de Jesus (por idade)</span></a>
    <a href="/pt/jesus/acts/" data-id="acts"><span class="n">4</span><span>Os atos de Jesus em O Livro de Urântia</span></a>
    <a href="/pt/jesus/teachings/" data-id="teachings"><span class="n">5</span><span>Os ensinamentos de Jesus</span></a>
    <a href="/pt/jesus-book/" data-id="life"><span class="n">6</span><span>A vida e os ensinamentos de Jesus</span></a>
    <a href="/pt/apostles-book/" data-id="apostles"><span class="n">7</span><span>Os doze apóstolos de Jesus</span></a>
  </nav>
</aside>
<main>
  <div class="bar"><b id="cur"></b><a id="newtab" href="#" target="_blank" rel="noopener">Abrir em uma nova aba ↗</a></div>
  <iframe id="view" title="Estudo sobre Jesus"></iframe>
</main>
<script>
var ITEMS = [{"id": "discourses", "name": "Os discursos de Jesus", "url": "/pt/jesus/discourses/"}, {"id": "chronology", "name": "Cronologia de Jesus (por ano)", "url": "/pt/jesus/chronology/"}, {"id": "ages", "name": "Cronologia de Jesus (por idade)", "url": "/pt/jesus/ages/"}, {"id": "acts", "name": "Os atos de Jesus em O Livro de Urântia", "url": "/pt/jesus/acts/"}, {"id": "teachings", "name": "Os ensinamentos de Jesus", "url": "/pt/jesus/teachings/"}, {"id": "life", "name": "A vida e os ensinamentos de Jesus", "url": "/pt/jesus-book/"}, {"id": "apostles", "name": "Os doze apóstolos de Jesus", "url": "/pt/apostles-book/"}];
var side = document.getElementById("side"), btn = document.getElementById("menuBtn");
function show(id, push) {
  var it = ITEMS.filter(function (x) { return x.id === id; })[0] || ITEMS[0];
  var f = document.getElementById("view");
  if (f.getAttribute("src") !== it.url) f.setAttribute("src", it.url);
  document.getElementById("cur").textContent = it.name;
  document.getElementById("newtab").href = it.url;
  document.querySelectorAll("nav a").forEach(function (a) { a.classList.toggle("on", a.dataset.id === it.id); });
  if (push) history.replaceState(null, "", "#" + it.id);
  side.classList.remove("open"); btn.setAttribute("aria-expanded", "false");
}
document.querySelectorAll("nav a").forEach(function (a) {
  a.onclick = function (e) { e.preventDefault(); show(a.dataset.id, true); };
});
btn.onclick = function () { var o = side.classList.toggle("open"); btn.setAttribute("aria-expanded", String(o)); };
window.addEventListener("hashchange", function () { show(location.hash.slice(1), false); });
try { localStorage.setItem("homeUrl", "/pt/"); } catch (e) {}
show(location.hash.slice(1), false);
</script>
</body>
</html>
