<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La vie et les enseignements de Jésus</title>
<meta name="description" content="La vie de Jésus d’après la Partie IV du Livre d’Urantia, racontée de nouveau comme un seul roman en 55 chapitres illustrés,.">
<meta property="og:title" content="La vie et les enseignements de Jésus — L’histoire que les Évangiles n’ont pas racontée">
<meta property="og:image" content="/books-img/jesus-book/cover.jpg">
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="/home-button.js" data-into=".top" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eee4;--paper:#fffcf5;--ink:#2a2622;--mute:#7a7066;--wine:#7b2d3b;--title:#8b3a2a;--sub:#4a6075;--line:#e6dccb;--fs:18px}
html[data-dark="1"]{--bg:#15130f;--paper:#1e1b17;--ink:#e6e0d6;--mute:#a0968a;--wine:#d9899a;--title:#e3a48f;--sub:#9fb7cc;--line:#352f28}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Arial,sans-serif}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:9px 16px;min-height:54px;background:var(--wine);color:#fff}
html[data-dark="1"] .top{background:#4a1d26}
.top b{font-family:"Noto Serif",Georgia,serif;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.top button{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.top #tg{display:none}
.bk-home{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;margin-right:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff!important;border:1px solid rgba(255,255,255,.55);font:700 13.5px/1.1 system-ui,"Segoe UI",Arial,sans-serif;text-decoration:none!important;white-space:nowrap}.bk-home:hover{background:rgba(255,255,255,.26)}.bk-home:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}@media print{.bk-home{display:none}}
.lay{display:grid;grid-template-columns:320px 1fr}
aside{position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto;background:var(--paper);border-right:1px solid var(--line);padding:10px 6px 40px}
.toc,.toc ul{list-style:none;margin:0;padding:0}
.toc .pt{font-family:"Noto Serif",Georgia,serif;font-size:13px;font-weight:700;color:var(--wine);margin:16px 12px 6px;letter-spacing:.02em}
.toc a{display:flex;gap:8px;padding:6px 10px;border-radius:7px;font-size:14px;line-height:1.45;color:inherit;text-decoration:none}
.toc a i{font-style:normal;flex:0 0 76px;color:var(--mute);font-size:12.5px;padding-top:1px}
.toc a:hover{background:rgba(123,45,59,.08)}
.toc li.cur>a{background:var(--wine);color:#fff}.toc li.cur>a i{color:#f6d9de}
.toc ul{display:none;margin:2px 0 8px 90px;border-left:2px solid var(--line)}
.toc li.cur ul{display:block}
.toc ul a{display:block;padding:3px 10px;font-size:13px;color:var(--mute)}
main{min-width:0;padding:30px 34px 90px}
article{max-width:760px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:46px 54px 40px;box-shadow:0 2px 14px rgba(60,40,20,.06)}
.kick{text-align:center;color:var(--mute);font-size:13px;letter-spacing:.08em}
h1{font-family:"Noto Serif",Georgia,serif;text-align:center;font-size:clamp(26px,3.8vw,36px);color:var(--title);margin:8px 0 6px;line-height:1.3;font-weight:700}
.src{text-align:center;color:var(--mute);font-size:13px;margin:0 0 22px}
.orn{display:block;text-align:center;color:var(--wine);letter-spacing:.6em;margin:6px 0 22px;font-size:14px}
figure{margin:0 0 30px}
figure img{display:block;width:100%;height:auto;border-radius:4px}
h3{font-family:"Noto Serif",Georgia,serif;font-size:20px;color:var(--sub);margin:38px 0 14px;scroll-margin-top:70px;font-weight:700}
p{font-family:"Noto Serif",Georgia,serif;font-size:var(--fs);line-height:1.85;margin:0 0 14px;text-align:justify;hyphens:auto;-webkit-hyphens:auto;text-indent:1.5em}
article.ch p.first{text-indent:0}
article.ch p.first::first-letter{float:left;font-size:3.1em;line-height:.95;margin:.06em .1em 0 0;color:var(--wine);font-weight:700}
blockquote{font-family:"Noto Serif",Georgia,serif;font-size:calc(var(--fs) - 1px);line-height:1.8;margin:18px 0 20px;padding:12px 20px;border-left:3px solid var(--wine);background:rgba(123,45,59,.05);color:var(--ink)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:44px;border-top:1px solid var(--line);padding-top:18px}
.nav a{color:var(--wine);text-decoration:none;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;max-width:48%}
.cover{display:flex;gap:28px;align-items:flex-start;margin-bottom:26px}
.cover img{width:230px;flex:0 0 230px;border-radius:3px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.cover .one{font-family:"Noto Serif",Georgia,serif;font-size:17px;line-height:1.7;color:var(--sub);margin:4px 0 14px}
.cover .meta{font-size:14px;color:var(--mute);line-height:1.8}
.who{margin:0 0 10px;padding-left:1.2em;font-family:"Noto Serif",Georgia,serif;line-height:1.75}
.who li{margin-bottom:6px}
.sig{text-align:right;text-indent:0}
.cq{text-align:center;text-indent:0;color:var(--sub)}
.nh{font-family:"Noto Serif",Georgia,serif;font-size:15px;color:var(--mute);margin:46px 0 10px;padding-top:16px;border-top:1px solid var(--line);text-align:center;letter-spacing:.06em}
p.note{font-family:inherit;font-size:14px;line-height:1.75;color:var(--mute);text-indent:0;text-align:left}
.hero{margin:0 0 24px}.hero img{display:block;width:100%;border-radius:4px}
.empty{color:var(--mute);padding:40px;text-align:center}
@media (max-width:860px){
  .top #tg{display:inline-block}
  .top b{display:none}
  .lay{display:block}
  aside{display:none;position:static;height:auto;max-height:72vh;border-right:0;border-bottom:1px solid var(--line)}
  body.toc aside{display:block}
  main{padding:14px 10px 60px}
  article{padding:28px 20px 28px}
  .cover{flex-direction:column;align-items:center}
}
html.embed .top,html.embed aside{display:none!important}
html.embed .lay{display:block}
html.embed main{padding:18px 16px 60px}
@media print{.top,aside,.nav{display:none!important}.lay{display:block}main{padding:0}body,article{background:#fff;border:0;box-shadow:none}}
</style>
<script>if(/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');</script>
</head>
<body>
<div class="top">
  <a class="bk-home" href="/fr/jesus/" target="_top" title="Étude sur Jésus">← Étude sur Jésus</a>
  <b>La vie et les enseignements de Jésus</b>
  <span class="sp"></span>
  <button id="tg">☰ Sommaire</button>
  <button id="fm" title="Texte plus petit" aria-label="Texte plus petit">A−</button><button id="fp" title="Texte plus grand" aria-label="Texte plus grand">A+</button>
  <button id="dk" title="Mode nuit" aria-label="Mode nuit">◐</button>
</div>
<div class="lay">
  <aside><ul class="toc" id="toc"></ul></aside>
  <main><article id="art"><div class="empty">Chargement…</div></article></main>
</div>
<script>
var BOOK={"title": "La vie et les enseignements de Jésus", "key": "jbefr"};
var L10N={"toc_about": "À propos", "toc_about_long": "À propos du livre et préface", "about_book": "À propos du livre", "and_preface": "et préface", "preface": "Préface", "illustration": "Illustration : {title}", "ub": "Le Livre d’Urantia"};
var Q=new URLSearchParams(location.search), C=Q.has('c')?Q.get('c'):'intro', T=[], V='55bb6021'+Math.floor(Date.now()/36e5);
var EMB=document.documentElement.classList.contains('embed');
function pad(n){return (n<10?'0':'')+n;}
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(t){return esc(t).replace(/\*([^*\n]+)\*/g,'<em>$1</em>');}
function load(src){var s=document.createElement('script');s.src=src+'?v='+V;document.head.appendChild(s);}
function url(c,h){return '?c='+c+(EMB?'&embed=1':'')+(h||'');}
var FS=18;
try{ if(localStorage.getItem(BOOK.key+'dark')==='1') document.documentElement.dataset.dark='1'; FS=+(localStorage.getItem(BOOK.key+'fs')||18); }catch(e){}
document.documentElement.style.setProperty('--fs',FS+'px');

window.TOC=function(t){
  T=t; var html='<li data-c="intro"><a href="'+url('intro')+'"><i>'+esc(L10N.toc_about)+'</i><span>'+esc(L10N.toc_about_long)+'</span></a></li>', part=null;
  T.forEach(function(x){
    if(x[3]&&x[3]!==part){part=x[3]; html+='<li class="pt">'+esc(part)+'</li>';}
    html+='<li data-c="'+x[0]+'"><a href="'+url(x[0])+'"><i>'+esc(x[1])+'</i><span>'+esc(x[2])+'</span></a>'
      +(x[4].length?'<ul>'+x[4].map(function(h,k){return '<li><a href="'+url(x[0],'#h'+(k+1))+'">'+fmt(h)+'</a></li>';}).join('')+'</ul>':'')+'</li>';
  });
  toc.innerHTML=html; open(C);
};
function mark(){[].forEach.call(toc.querySelectorAll('li[data-c]'),function(li){li.classList.toggle('cur',li.dataset.c===String(C));});
  var c=toc.querySelector('li.cur'); if(c&&c.scrollIntoView&&!EMB) c.scrollIntoView({block:'nearest'});}
function open(c){C=c; mark(); load(c==='intro'?'data/intro.js':'data/ch'+pad(+c)+'.js');}
function idx(c){return c==='intro'?-1:T.findIndex(function(x){return String(x[0])===String(c);});}
function nav(){
  var i=idx(C), pv=i<0?null:(i===0?['intro',L10N.about_book,L10N.and_preface]:T[i-1]), nx=T[i+1];
  return '<div class="nav">'+(pv?'<a href="'+url(pv[0])+'">← '+esc(pv[1])+' '+esc(pv[2])+'</a>':'<span></span>')
    +(nx?'<a href="'+url(nx[0])+'">'+esc(nx[1])+' '+esc(nx[2])+' →</a>':'')+'</div>';
}
function body(b,drop){
  var h=0, first=drop, s='';
  b.forEach(function(x){
    if(x[0]==='h'){h++; s+='<h3 id="h'+h+'">'+fmt(x[1])+'</h3>';}
    else if(x[0]==='q') s+='<blockquote>'+fmt(x[1])+'</blockquote>';
    else if(x[0]==='nh') s+='<div class="nh">❦ '+fmt(x[1])+' ❦</div>';
    else if(x[0]==='n') s+='<p class="note">'+fmt(x[1])+'</p>';
    else {s+='<p'+(first?' class="first"':'')+'>'+fmt(x[1])+'</p>'; first=false;}
  });
  return s;
}
function done(){
  if(location.hash){var el=document.querySelector(location.hash); if(el){el.scrollIntoView(); return;}}
  window.scrollTo(0,0);
}
window.INTRO=function(d){
  if(C!=='intro') return;
  document.title=d.title;
  art.className='intro';
  var s;
  if(d.cover){
    s='<div class="cover"><img src="'+d.cover+'" alt="'+esc(d.coverAlt)+'"><div>'
      +'<h1 style="text-align:left;margin-top:0;font-size:clamp(24px,3vw,30px)">'+esc(d.title)+'</h1>'
      +'<div class="src" style="text-align:left">'+esc(d.sub)+'</div>'
      +'<div class="one">'+fmt(d.one)+'</div>'
      +'<div class="meta">'+d.meta.map(esc).join('<br>')+'</div></div></div>';
  } else {
    s='<div class="kick">'+esc(d.kick)+'</div><h1>'+esc(d.title)+'</h1>'
      +'<div class="src">'+esc(d.sub)+'</div>'
      +'<figure class="hero"><img src="'+d.hero+'" alt="'+esc(d.heroAlt)+'"></figure>'
      +'<p class="cq" style="font-size:17px;line-height:1.75">'+fmt(d.one)+'</p>'
      +'<p class="cq" style="font-size:14px">'+d.meta.map(esc).join('<br>')+'</p>';
  }
  s+='<h3>'+esc(L10N.about_book)+'</h3>'+d.about.map(function(p){return '<p>'+fmt(p)+'</p>';}).join('');
  (d.lists||[]).forEach(function(L){
    s+='<h3>'+esc(L[0])+'</h3><ul class="who">'+L[1].map(function(p){return '<li>'+fmt(p)+'</li>';}).join('')+'</ul>';
  });
  s+='<h3 id="pre">'+esc(L10N.preface)+'</h3>';
  d.preface.forEach(function(x){
    var t=x[1];
    if(x[0]==='h') s+='<h3>'+fmt(t)+'</h3>';
    else if(t==='Jay Han') s+='<p class="sig">'+esc(t)+'</p>';
    else if(/^[“"«]/.test(t)) s+='<p class="cq">'+fmt(t)+'</p>';
    else s+='<p>'+fmt(t)+'</p>';
  });
  art.innerHTML=s+nav(); done();
};
window.CH=function(c){
  if(String(c.n)!==String(C)) return;
  document.title=c.label+': '+c.title+' · '+BOOK.title;
  art.className='ch';
  var s='<div class="kick">'+esc(c.part?c.part+' · ':'')+esc(c.label)+'</div><h1>'+esc(c.title)+'</h1>'
    +'<div class="src"><em>'+esc(L10N.ub)+'</em>, '+esc(c.src)+'</div>';
  s+=c.img?'<figure><img src="'+c.img+'" alt="'+esc(L10N.illustration.replace('{title}',c.title))+'" loading="eager"></figure>':'<span class="orn">❦ ❦ ❦</span>';
  art.innerHTML=s+body(c.b,true)+nav(); done();
};
function go(href){
  var m=href.match(/c=([^&#]+)[^#]*(#.*)?/); if(!m) return false;
  var c=m[1];
  if(c===String(C)&&m[2]){history.replaceState(null,'',href); var el=document.querySelector(m[2]); if(el) el.scrollIntoView({behavior:'smooth'}); return true;}
  history.pushState(null,'',href); open(c); return true;
}
document.addEventListener('click',function(e){
  var a=e.target.closest('.toc a,.nav a'); if(!a) return;
  if(go(a.getAttribute('href'))){e.preventDefault(); document.body.classList.remove('toc');}
});
window.addEventListener('popstate',function(){var q=new URLSearchParams(location.search); open(q.has('c')?q.get('c'):'intro');});
tg.onclick=function(){document.body.classList.toggle('toc');};
function setFs(d){FS=Math.min(24,Math.max(14,FS+d)); document.documentElement.style.setProperty('--fs',FS+'px'); try{localStorage.setItem(BOOK.key+'fs',FS);}catch(e){}}
fm.onclick=function(){setFs(-1);}; fp.onclick=function(){setFs(1);};
dk.onclick=function(){var r=document.documentElement; if(r.dataset.dark==='1') delete r.dataset.dark; else r.dataset.dark='1'; try{localStorage.setItem(BOOK.key+'dark',r.dataset.dark?'1':'0');}catch(e){}};
load('data/toc.js');
</script>
</body>
</html>
